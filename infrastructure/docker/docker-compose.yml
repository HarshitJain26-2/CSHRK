version: '3.8'

services:
  # ==============================================================================
  # PostgreSQL 16 with PostGIS 3.4 Spatial Extensions
  # ==============================================================================
  postgres:
    image: postgis/postgis:16-3.4
    container_name: cshrk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-cshrk_db}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - cshrk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-cshrk_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # CSHRK Backend API (NestJS Modular Monolith)
  # ==============================================================================
  api:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: cshrk_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api/v1
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_NAME: ${DATABASE_NAME:-cshrk_db}
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-cshrk_dev_jwt_super_secret_key_change_in_production_32char}
      JWT_EXPIRES_IN: 7d
    ports:
      - "${PORT:-3000}:3000"

  # ==============================================================================
  # CSHRK AI Intelligence Service (Python FastAPI Skeleton)
  # ==============================================================================
  ai:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.ai
    container_name: cshrk_ai
    restart: unless-stopped
    environment:
      PORT: 8000
      HOST: 0.0.0.0
    ports:
      - "8000:8000"

volumes:
  cshrk_pgdata:
    driver: local
