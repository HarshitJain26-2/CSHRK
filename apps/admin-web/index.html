<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Workforce Core — Enterprise Administration Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
    <style>
      @layer base {
        html, body {
          margin: 0;
          padding: 0;
          width: 100%;
          min-height: 100vh;
        }
        body {
          overscroll-behavior: none;
        }
        .pb-safe {
          padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        .pt-safe {
          padding-top: env(safe-area-inset-top, 0px);
        }
        .no-scrollbar::-webkit-scrollbar {
          display: none;
        }
        .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
        }
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        display: inline-block;
        vertical-align: middle;
        line-height: 1;
      }
      .material-symbols-outlined.fill-1 {
        font-variation-settings: 'FILL' 1;
      }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
              "on-primary": "#ffffff",
              "on-tertiary-container": "#5fcdbf",
              "on-surface": "#0b1c30",
              "primary-container": "#1e40af",

              "surface-tint": "#3755c3",
              "surface-container": "#e5eeff",

              "surface-container-low": "#eff4ff",
              "on-tertiary-fixed-variant": "#005049",
              "primary": "#00288e",
              "secondary-container": "#dae2fd",
              "secondary": "#565e74",
              "on-tertiary-fixed": "#00201d",
              "on-primary-fixed": "#001453",
              "on-error-container": "#93000a",
              "outline": "#757684",
              "surface-container-high": "#dce9ff",
              "on-secondary-container": "#5c647a",
              "error-container": "#ffdad6",
              "secondary-fixed": "#dae2fd",
              "on-secondary-fixed-variant": "#3f465c",
              "surface-container-highest": "#d3e4fe",
              "inverse-primary": "#b8c4ff",
              "outline-variant": "#c4c5d5",
              "surface": "#f8f9ff",
              "surface-variant": "#d3e4fe",
              "tertiary": "#003c36",
              "surface-dim": "#cbdbf5",
              "secondary-fixed-dim": "#bec6e0",
              "primary-fixed": "#dde1ff",
              "on-background": "#0b1c30",
              "surface-container-lowest": "#ffffff",
              "on-secondary": "#ffffff",
              "on-primary-container": "#a8b8ff",
              "background": "#f8f9ff",
              "on-surface-variant": "#444653",
              "inverse-on-surface": "#eaf1ff",
              "surface-bright": "#f8f9ff",
              "on-secondary-fixed": "#131b2e",
              "on-primary-fixed-variant": "#173bab",
              "error": "#ba1a1a",
              "inverse-surface": "#213145",
              "tertiary-fixed": "#89f5e7",
              "primary-fixed-dim": "#b8c4ff",
              "on-error": "#ffffff"
            },
            "borderRadius": {
              "DEFAULT": "0.125rem",
              "lg": "0.25rem",

            },
            "spacing": {

            "fontFamily": {

              "label-md": ["13px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "600" }],

          }
        }
      }
    </script>
  </head>
  <body class="bg-surface font-body-md text-body-md text-on-surface">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
